name: 機票查價

on:
  schedule:
    # GitHub 用 UTC：00:47 與 12:47 UTC = 台北 08:47 與 20:47
    - cron: "47 0,12 * * *"
  workflow_dispatch: {}   # 可在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04   # 固定版本，避免 10/19 起 ubuntu-latest 換成 26 版影響 Playwright 安裝
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安裝 Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: 查價
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_EVERY_RUN: ${{ vars.NOTIFY_EVERY_RUN }}
        run: python tracker.py

      - name: 飯店查價
        if: always()
        continue-on-error: true   # 飯店網站失敗時不影響機票結果存檔
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hotel_tracker.py

      - name: 其他行程查價（trips/*/）
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_EVERY_RUN: ${{ vars.NOTIFY_EVERY_RUN }}
        run: |
          shopt -s nullglob
          for d in trips/*/; do
            if [ -f "$d/config.json" ]; then python tracker.py --trip "$d" || echo "::warning::機票查價失敗 $d"; fi
            if [ -f "$d/hotels.json" ]; then python hotel_tracker.py --trip "$d" || echo "::warning::飯店查價失敗 $d"; fi
          done

      - name: 存回結果
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data/ trips/
          git diff --cached --quiet || git commit -m "價格更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
